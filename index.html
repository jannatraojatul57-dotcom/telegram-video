<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Landing Page</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          backdropBlur: {
            xs: '2px',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
    }
  </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center justify-center px-6">

  <!-- Background Glow -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
    <div class="absolute w-72 h-72 bg-purple-500 rounded-full blur-3xl opacity-30 top-10 left-10"></div>
    <div class="absolute w-72 h-72 bg-blue-500 rounded-full blur-3xl opacity-30 bottom-10 right-10"></div>
  </div>

  <!-- Glass Card -->
  <div class="backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl rounded-2xl p-8 max-w-2xl w-full text-center">

    <h1 class="text-4xl font-bold mb-4">🔥 Premium Viral Hub</h1>
    <p class="text-gray-300 mb-6">
      Latest viral videos & exclusive content in one place. Clean, fast and modern UI.
    </p>

    <!-- CTA Buttons -->
    <div class="flex justify-center gap-4 mb-8">
      <a href="#" class="px-5 py-2 bg-purple-500 hover:bg-purple-600 rounded-xl transition">
        Join Now
      </a>
      <a href="#" class="px-5 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl transition">
        Learn More
      </a>
    </div>

    <!-- Telegram Widget -->
    <div class="rounded-xl overflow-hidden border border-white/10">
      <script async src="https://telegram.org/js/telegram-widget.js?23"
        data-telegram-post="more_viral_video/46"
        data-width="100%">
      </script>
    </div>

  </div>

  <!-- Footer -->
  <footer class="absolute bottom-4 text-gray-400 text-sm">
    © 2026 Premium Landing. All rights reserved.
  </footer>

</body>
</html>
